name: Elevator-Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.25'

jobs:
  # Backend linting job
  lint-backend:
    name: Lint Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.10.1
        args: --timeout=5m

  # Frontend linting job
  lint-frontend:
    name: Lint Frontend (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install client dependencies
      working-directory: client
      run: npm ci

    - name: Run ESLint
      working-directory: client
      run: npm run lint

    - name: Run TypeScript typecheck
      working-directory: client
      run: npm run typecheck

  # Backend unit tests
  unit_tests_backend:
    name: Unit Tests (Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run Go unit tests with coverage
      run: |
        go test -v -short -coverprofile=coverage.out $(go list ./internal/... ./cmd/...)

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: github.event_name == 'push'
      with:
        file: ./coverage.out
        fail_ci_if_error: false

  # Frontend unit tests
  unit_tests_frontend:
    name: Unit Tests (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install client dependencies
      working-directory: client
      run: npm ci

    - name: Run client tests
      working-directory: client
      run: npm test

  # Race condition tests - runs simultaneously with other tests
  race_tests:
    name: Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run race tests with verbose output
      run: |
        echo "Starting race tests..."
        echo "Setting GORACE environment variable..."
        export GORACE=1
        make test/race 2>&1 | tee race_test_output.log
        echo "Race tests completed with exit code: $?"

    - name: Upload race test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: race-test-logs
        path: race_test_output.log

  # Full race condition tests (without -short flag) - for debugging
  race_tests_full:
    name: Full Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run full race tests with verbose output
      run: |
        echo "Starting full race tests (without -short flag)..."
        echo "Setting GORACE environment variable..."
        export GORACE=1
        make test/race-full 2>&1 | tee race_test_full_output.log
        echo "Full race tests completed with exit code: $?"

    - name: Upload full race test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: race-test-full-logs
        path: race_test_full_output.log

  # Integration/Acceptance tests - runs simultaneously with other tests
  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run acceptance tests
      run: DEFAULT_ELEVATOR_COUNT=0 make test/acceptance

    - name: Run integration tests with testcontainers
      run: make test/integration

  # Build job - runs only after all tests pass
  build:
    name: Build & Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-backend, lint-frontend, unit_tests_backend, unit_tests_frontend, race_tests, integration_tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Build Go binary
      run: make build

    - name: Build backend Docker image
      run: make docker/build-server

    - name: Build frontend Docker image
      run: make docker/build-client

    - name: Verify images
      run: |
        docker images | grep elevator
        echo "Backend image built: elevator-backend:latest"
        echo "Frontend image built: elevator-frontend:latest"

    - name: Cleanup Docker resources
      if: always()
      run: |
        docker rmi elevator-backend:latest || true
        docker rmi elevator-frontend:latest || true

  # Benchmark tests - runs on each push
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run benchmarks
      run: make test/benchmarks

  # Final check job - ensures all critical jobs pass
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, unit_tests_backend, unit_tests_frontend, race_tests, race_tests_full, integration_tests, build]
    if: always()

    steps:
    - name: Check all jobs
      run: |
        if [[ "${{ needs.lint-backend.result }}" != "success" ]]; then
          echo "Backend lint job failed"
          exit 1
        fi
        if [[ "${{ needs.lint-frontend.result }}" != "success" ]]; then
          echo "Frontend lint job failed"
          exit 1
        fi
        if [[ "${{ needs.unit_tests_backend.result }}" != "success" ]]; then
          echo "Backend unit tests failed"
          exit 1
        fi
        if [[ "${{ needs.unit_tests_frontend.result }}" != "success" ]]; then
          echo "Frontend unit tests failed"
          exit 1
        fi
        if [[ "${{ needs.race_tests.result }}" != "success" ]]; then
          echo "Race tests failed"
          exit 1
        fi
        if [[ "${{ needs.race_tests_full.result }}" != "success" ]]; then
          echo "Full race tests failed"
          exit 1
        fi
        if [[ "${{ needs.integration_tests.result }}" != "success" ]]; then
          echo "Integration tests failed"
          exit 1
        fi
        if [[ "${{ needs.build.result }}" != "success" ]]; then
          echo "Build failed"
          exit 1
        fi
        echo "All checks passed!"
