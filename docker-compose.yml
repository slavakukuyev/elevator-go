services:
  # Backend - Go Elevator Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: elevator-backend
    ports:
      - "6660:6660"  # REST API
      - "6661:6661"  # WebSocket server
    environment:
      # Use development configuration for easier testing
      ENV: development
      LOG_LEVEL: DEBUG
      PORT: 6660

      # Enable features needed for the demo
      METRICS_ENABLED: "true"
      WEBSOCKET_ENABLED: "true"
      HEALTH_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"

      # Elevator configuration
      DEFAULT_MAX_FLOOR: 15
      DEFAULT_MIN_FLOOR: 0
      DEFAULT_ELEVATOR_COUNT: 3
      ELEVATOR_NAME_PREFIX: "Elevator"

      # Performance settings
      EACH_FLOOR_DURATION: 2s
      OPEN_DOOR_DURATION: 3s
      STATUS_UPDATE_INTERVAL: 1s

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6660/v1/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - elevator-network

  # Frontend - React Client (nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: elevator-frontend
    ports:
      - "8080:80"  # React client served on port 8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - elevator-network

networks:
  elevator-network:
    driver: bridge 